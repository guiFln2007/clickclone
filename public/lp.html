.js" async=""></script><script src="_lp/static/chunks/app/[locale]/(home)/layout-30905fbdf5df1aca.js" async=""></script><script src="_lp/static/chunks/5788-baa3c78d5e171451.js" async=""></script><script src="_lp/static/chunks/8544-b56a82aa7438748e.js" async=""></script><script src="_lp/static/chunks/1476-b25c8e275c74dd08.js" async=""></script><script src="_lp/static/chunks/app/[locale]/layout-f8a19f539453de89.js" async=""></script><link rel="preload" href="_lp/static/css/65aa3619a1925c9d.css" as="style"/><link rel="preload" href="https://www.googletagmanager.com/gtag/js?id=AW-17992071249" as="script"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><style id="ratoads-hero-style">
/* Force pure black background site-wide (override Tailwind neutral-900 navy) */
html,body{background:#000 !important;background-color:#000 !important;}
body.dark\:bg-neutral-900,body[class*="bg-neutral"]{background:#000 !important;background-color:#000 !important;}
main,main > section,section[class*="overflow-hidden"]{background-color:transparent !important;}
/* Kill all blue decorative gradients from mineraroi brand */
[class*="from-minera-dark"],[class*="to-minera-dark"],[class*="via-minera-dark"],
[class*="from-sky"],[class*="to-sky"],[class*="via-sky"],
[class*="from-blue"],[class*="to-blue"],[class*="via-blue"]{background-image:none !important;}
/* Kill the full-page navy gradient background overlay */
div.absolute.inset-0.min-h-full{background:#000 !important;background-image:none !important;}
/* Kill all animated blue blob/glow decorations */
[class*="animate-blob"]{display:none !important;}
/* Replace neutral-800/900 slate backgrounds with neutral dark */
[class*="bg-neutral-9"],[class*="bg-neutral-8"]{background-color:#0a0a0a !important;}
/* Recolor minera-dark badges to ratoads orange */
[class*="text-minera-dark"]{color:#FF8C00 !important;}
[class*="border-minera-dark"]{border-color:#FF8C00 !important;}
/* Solid orange pill background → force black text (overrides the text-minera-dark rule above) */
[class*="bg-minera-dark"]{background-color:#FF8C00 !important;color:#000 !important;}
[class*="bg-minera-dark"][class*="text-minera-dark"]{color:#000 !important;}
/* Custom AOS replacement — AOS library doesn't load on the static clone, so we run our own IntersectionObserver */
[data-aos]{opacity:0;transition:opacity 0.7s cubic-bezier(0.22,0.61,0.36,1),transform 0.7s cubic-bezier(0.22,0.61,0.36,1);will-change:opacity,transform;}
[data-aos="fade-up"]{transform:translateY(48px);}
[data-aos="fade-down"]{transform:translateY(-48px);}
[data-aos="fade-left"]{transform:translateX(48px);}
[data-aos="fade-right"]{transform:translateX(-48px);}
[data-aos="zoom-in"]{transform:scale(0.85);}
[data-aos="zoom-in-up"]{transform:scale(0.88) translateY(30px);}
[data-aos].ra-aos-in{opacity:1 !important;transform:none !important;}
/* Premium card pulse glow */
@keyframes ra-pulse-glow{0%,100%{box-shadow:0 0 60px rgba(255,140,0,0.25),0 0 120px rgba(255,140,0,0.12);}50%{box-shadow:0 0 70px rgba(255,140,0,0.4),0 0 140px rgba(255,140,0,0.18);}}
@keyframes ra-fade-up-keyframe{from{opacity:0;transform:translateY(32px);}to{opacity:1;transform:none;}}
/* Original mineraroi sections kept visible; copies will be rewritten via JS */
/* Force-show the first original section (it carries the "soubesse hoje" block we kept) */
main > section[data-replaced-by-ratoads="1"]{display:block !important;}
/* Hide the original MineraROI plans section (replaced by #ratoads-custom-plans) */
main > section#plans{display:none !important;}
/* === Shared ratoads section styles === */
.ra-section{position:relative;background:#000;padding:100px 24px;font-family:'Sora',sans-serif;color:#fff;}
.ra-section .ra-wrap{max-width:1100px;margin:0 auto;text-align:center;}
.ra-section .ra-kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:2.5px;color:#FF8C00;text-transform:uppercase;margin-bottom:14px;padding:6px 14px;background:rgba(255,140,0,0.08);border:1px solid rgba(255,140,0,0.25);border-radius:999px;}
.ra-section .ra-title{font-size:clamp(32px,4.5vw,56px);font-weight:800;letter-spacing:-0.025em;line-height:1.1;margin:0 0 24px;color:#fff;}
.ra-section .ra-title .accent{color:#FF8C00;}
.ra-section .ra-lead{color:#999;font-size:17px;line-height:1.55;max-width:620px;margin:0 auto 60px;}
/* PROCESSO + NA PRÁTICA shared step cards */
.ra-steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:left;}
.ra-step{position:relative;background:linear-gradient(180deg,#0d0d0d 0%,#070707 100%);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:36px 32px;display:flex;flex-direction:column;gap:18px;transition:transform 0.3s ease,border-color 0.3s ease;}
.ra-step:hover{transform:translateY(-6px);border-color:rgba(255,140,0,0.3);}
.ra-step .ra-step-num{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:2px;color:#FF8C00;text-transform:uppercase;}
.ra-step .ra-step-num::before{content:"";width:32px;height:1px;background:#FF8C00;}
.ra-step h3{font-size:22px;font-weight:700;color:#fff;margin:0;letter-spacing:-0.01em;}
.ra-step p{font-size:15px;color:#aaa;line-height:1.6;margin:0;}
.ra-step .ra-step-icon{width:48px;height:48px;border-radius:14px;background:rgba(255,140,0,0.10);display:flex;align-items:center;justify-content:center;color:#FF8C00;font-size:22px;margin-bottom:4px;}
/* O QUE VOCÊ RECEBE — 3 deliverables */
.ra-deliv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:left;}
.ra-deliv{background:linear-gradient(160deg,#101010 0%,#060606 100%);border:1px solid rgba(255,140,0,0.18);border-radius:24px;padding:36px 30px;display:flex;flex-direction:column;gap:16px;transition:all 0.3s ease;}
.ra-deliv:hover{border-color:#FF8C00;box-shadow:0 0 30px rgba(255,140,0,0.15);}
.ra-deliv .ra-deliv-icon{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#FF8C00 0%,#B85C12 100%);display:flex;align-items:center;justify-content:center;font-size:24px;color:#000;font-weight:800;}
.ra-deliv h3{font-size:20px;font-weight:700;color:#fff;margin:0;letter-spacing:-0.01em;}
.ra-deliv p{font-size:14.5px;color:#aaa;line-height:1.6;margin:0;}
/* QUEM USA testimonials */
.ra-test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:left;}
.ra-test{background:#0a0a0a;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;}
.ra-test .ra-stars{color:#FF8C00;letter-spacing:2px;font-size:14px;}
.ra-test p{font-size:14px;color:#ccc;line-height:1.55;margin:0;font-style:italic;}
.ra-test .ra-test-author{display:flex;align-items:center;gap:12px;}
.ra-test .ra-test-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FF8C00,#B85C12);display:flex;align-items:center;justify-content:center;color:#000;font-weight:800;font-size:14px;}
.ra-test .ra-test-meta{display:flex;flex-direction:column;gap:2px;}
.ra-test .ra-test-name{font-size:13px;font-weight:700;color:#fff;}
.ra-test .ra-test-role{font-size:11.5px;color:#777;}
/* FAQ */
.ra-faq-list{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px;text-align:left;}
.ra-faq{background:#0a0a0a;border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;transition:border-color 0.2s ease;}
.ra-faq[open]{border-color:rgba(255,140,0,0.3);}
.ra-faq summary{padding:22px 26px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.ra-faq summary::-webkit-details-marker{display:none;}
.ra-faq summary::after{content:"+";color:#FF8C00;font-size:24px;font-weight:300;transition:transform 0.25s ease;flex-shrink:0;}
.ra-faq[open] summary::after{transform:rotate(45deg);}
.ra-faq .ra-faq-body{padding:0 26px 22px;color:#aaa;font-size:15px;line-height:1.6;}
/* CTA Final */
#ratoads-custom-cta{padding:120px 24px;background:radial-gradient(ellipse at center,rgba(255,140,0,0.12) 0%,rgba(255,140,0,0) 50%),#000;text-align:center;}
#ratoads-custom-cta h2{font-size:clamp(36px,5vw,64px);font-weight:800;letter-spacing:-0.025em;margin:0 0 20px;color:#fff;line-height:1.1;}
#ratoads-custom-cta p{color:#999;font-size:18px;margin:0 0 36px;}
#ratoads-custom-cta .ra-cta-btn{background:#FF8C00;color:#000;border:none;padding:20px 40px;border-radius:14px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(255,140,0,0.35);transition:all 0.2s ease;}
#ratoads-custom-cta .ra-cta-btn:hover{background:#FFA01F;transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,140,0,0.5);}
@media(max-width:820px){.ra-steps-grid,.ra-deliv-grid,.ra-test-grid{grid-template-columns:1fr;justify-items:center;}.ra-deliv,.ra-steps-grid > *,.ra-test-grid > *{width:100%;max-width:340px;margin:0 auto;}}
/* Placeholder for broken images/videos */
.ra-placeholder{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:linear-gradient(135deg,#1a1a1a 0%,#0f0f0f 100%);border:1px dashed rgba(255,140,0,0.35);border-radius:14px;color:#888;font-family:'Sora',sans-serif;font-size:13px;text-align:center;padding:24px;min-height:160px;width:100%;height:100%;box-sizing:border-box;}
.ra-placeholder .ra-ph-icon{width:42px;height:42px;border-radius:50%;background:rgba(255,140,0,0.10);display:flex;align-items:center;justify-content:center;color:#FF8C00;font-size:22px;}
.ra-placeholder .ra-ph-label{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#FF8C00;}
.ra-placeholder .ra-ph-caption{font-size:12px;color:#777;max-width:280px;line-height:1.4;}
/* Expand-to-fullscreen icon overlay (mobile only — desktop has native video player controls) */
.ra-expand-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;background:rgba(0,0,0,0.62);border:1px solid rgba(255,140,0,0.32);border-radius:8px;display:none;align-items:center;justify-content:center;cursor:pointer;color:#FF8C00;z-index:5;backdrop-filter:blur(4px);transition:background .15s,border-color .15s,transform .15s;}
.ra-expand-btn:hover{background:rgba(255,140,0,0.15);border-color:rgba(255,140,0,0.6);transform:scale(1.05);}
.ra-expand-btn svg{width:16px;height:16px;display:block;}
.ra-expand-host{position:relative !important;}
@media(max-width:640px){.ra-expand-btn{display:inline-flex;}}
/* Lightbox/fullscreen overlay */
#ra-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);}
#ra-lightbox.open{display:flex;}
#ra-lightbox .ra-lb-content{max-width:1100px;width:100%;max-height:92vh;display:flex;align-items:center;justify-content:center;}
#ra-lightbox .ra-lb-content img,#ra-lightbox .ra-lb-content video{max-width:100%;max-height:88vh;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
#ra-lightbox .ra-lb-close{position:absolute;top:18px;right:18px;width:44px;height:44px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:10px;color:#fff;font-size:24px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
#ra-lightbox .ra-lb-close:hover{background:rgba(255,255,255,0.16);}
/* === Ratoads Plans section === */
#ratoads-custom-plans{position:relative;background:#000;padding:100px 20px 120px;font-family:'Sora',sans-serif;color:#fff;scroll-margin-top:80px;}
#ratoads-custom-plans .rp-wrap{max-width:1200px;margin:0 auto;}
#ratoads-custom-plans .rp-title{text-align:center;font-size:clamp(32px,4.5vw,52px);font-weight:800;letter-spacing:-0.02em;margin:0 0 12px;}
#ratoads-custom-plans .rp-subtitle{text-align:center;color:#888;font-size:17px;margin:0 0 64px;}
#ratoads-custom-plans .rp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;max-width:1100px;margin:0 auto;}
#ratoads-custom-plans .rp-card{position:relative;background:#0a0a0a;border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:52px 44px;display:flex;flex-direction:column;gap:30px;transition:transform 0.3s ease;}
#ratoads-custom-plans .rp-card:hover{transform:translateY(-4px);}
#ratoads-custom-plans .rp-card.rp-featured{border:2px solid #FF8C00;animation:ra-pulse-glow 3.5s ease-in-out infinite;}
#ratoads-custom-plans .rp-card-head{display:flex;flex-direction:column;gap:10px;}
#ratoads-custom-plans .rp-card-name{font-size:15px;font-weight:700;letter-spacing:2.5px;color:#fff;text-transform:uppercase;}
#ratoads-custom-plans .rp-price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
#ratoads-custom-plans .rp-price{font-size:72px;font-weight:800;color:#fff;line-height:1;letter-spacing:-0.03em;}
#ratoads-custom-plans .rp-price-cents{font-size:40px;font-weight:700;color:#fff;}
#ratoads-custom-plans .rp-price-period{color:#888;font-size:15px;margin-left:4px;}
#ratoads-custom-plans .rp-price-save{color:#888;font-size:13px;margin-top:-4px;}
#ratoads-custom-plans .rp-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:1px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,0.06);color:#aaa;text-transform:uppercase;width:fit-content;}
#ratoads-custom-plans .rp-tag.rp-tag-popular{background:#FF8C00;color:#000;}
#ratoads-custom-plans .rp-features{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;}
#ratoads-custom-plans .rp-features{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:18px;}
#ratoads-custom-plans .rp-features li{display:flex;align-items:center;gap:12px;font-size:17px;color:#e5e5e5;font-weight:500;}
#ratoads-custom-plans .rp-features li::before{content:"+";color:#FF8C00;font-weight:800;font-size:22px;flex-shrink:0;width:18px;text-align:center;}
#ratoads-custom-plans .rp-cta{width:100%;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#fff;padding:18px 24px;border-radius:16px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
#ratoads-custom-plans .rp-cta:hover{border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.04);}
#ratoads-custom-plans .rp-cta.rp-cta-primary{background:#FF8C00;color:#000;border-color:#FF8C00;}
#ratoads-custom-plans .rp-cta.rp-cta-primary:hover{background:#FFA01F;border-color:#FFA01F;}
#ratoads-custom-plans .rp-footnote{text-align:center;color:#666;font-size:12px;margin-top:8px;}
@media(max-width:720px){#ratoads-custom-plans .rp-grid{grid-template-columns:1fr;}#ratoads-custom-plans .rp-card{padding:28px 24px;}#ratoads-custom-plans .rp-price{font-size:48px;}}
/* But repaint text-clip gradients with orange instead of removing them */
[class*="bg-clip-text"][class*="minera-dark"],
[class*="bg-clip-text"][class*="from-sky"],
[class*="bg-clip-text"][class*="from-blue"]{
  background-image:linear-gradient(to right,#FF8C00,#FFB347,#FF8C00) !important;
  -webkit-background-clip:text !important;
  background-clip:text !important;
  color:transparent !important;
}
/* Hide mineraroi's original navbar — we replace it with our own ratoads pill */
body > header:not(#ratoads-custom-nav),body > div > header:not(#ratoads-custom-nav),#__next > header:not(#ratoads-custom-nav){display:none !important;}
header:has(button.font-poppins):not(#ratoads-custom-nav){display:none !important;}
/* Ratoads floating pill navbar */
#ratoads-custom-nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;justify-content:space-between;gap:32px;background:rgba(20,20,20,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:999px;padding:8px 8px 8px 18px;width:calc(100% - 32px);max-width:920px;font-family:'Sora',sans-serif;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
#ratoads-custom-nav .rn-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
#ratoads-custom-nav .rn-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;}
#ratoads-custom-nav .rn-brand{font-weight:700;font-size:15px;color:#fff;letter-spacing:0.2px;}
#ratoads-custom-nav .rn-links{display:flex;gap:28px;align-items:center;flex:1;justify-content:center;}
#ratoads-custom-nav .rn-links a{color:#888;text-decoration:none;font-size:14px;font-weight:500;transition:color 0.15s ease;}
#ratoads-custom-nav .rn-links a:hover{color:#fff;}
#ratoads-custom-nav .rn-cta{background:#FF8C00;color:#000;border:none;padding:10px 22px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all 0.15s ease;flex-shrink:0;}
#ratoads-custom-nav .rn-cta:hover{background:#FFA01F;transform:translateY(-1px);}

/* Zera padding-top do <main> quando o hero ratoads está injetado, removendo a faixa preta acima dele */
main.relative.z-10.pt-20:has(#ratoads-real-hero){padding-top:0 !important;}
main:has(#ratoads-real-hero){padding-top:0 !important;}
/* CSS escopado do hero ratoads.com.br — clone fiel */
#ratoads-real-hero{position:relative;background:#000;overflow:hidden;font-family:'Sora',sans-serif;min-height:100vh;display:flex;align-items:center;padding:220px 40px 200px;text-align:center;color:#fff;}
#ratoads-real-hero *,#ratoads-real-hero *::before,#ratoads-real-hero *::after{box-sizing:border-box;margin:0;padding:0;}
#ratoads-real-hero .ra-dot-grid{position:absolute;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1px);background-size:24px 24px;}

/* ratoads palette overrides — recolor blue/slate buttons to orange */
header button[style*="rgb(8, 102, 255)"],
header a[style*="rgb(8, 102, 255)"],
nav button[style*="rgb(8, 102, 255)"],
nav a[style*="rgb(8, 102, 255)"]{background:#FF8C00 !important;color:#000 !important;}
[class*="bg-blue"],[class*="bg-primary"]{background-color:#FF8C00 !important;}
[class*="text-blue"]{color:#FF8C00 !important;}
[class*="border-blue"]{border-color:#FF8C00 !important;}
/* Catch the specific entrar/cta buttons via inline computed style */
button.font-poppins[class*="h-12"],button.font-poppins[class*="h-\\[38px\\]"]{background:#FF8C00 !important;color:#000 !important;}
/* Hide the "#1, #2, #3, #4" numbered badges before section titles (Pricing, FAQ etc) — both PC and mobile */
span[class*="bg-minera-dark-500"][class*="rounded-2xl"][class*="font-bold"][class*="text-sm"]{display:none !important;}
/* Hide the small "Perguntas Frequentes" pill (h1 with text-sm), keep the big h1 below.
   The pill container has rounded-3xl + minera-dark-900 gradient. */
div[class*="rounded-3xl"][class*="from-minera-dark-900"]:has(> h1.text-sm){display:none !important;}
/* === Mobile: tighten oversized vertical gaps & padding (≤640px) ===
   Minera's original sections use py-16/py-10/pb-16 (64px+) as their MOBILE base,
   and the custom plans section hardcodes 100/120px — both create big empty gaps. */
@media(max-width:640px){
  #ratoads-custom-plans{padding-top:44px !important;padding-bottom:52px !important;}
  #ratoads-custom-plans .rp-subtitle{margin-bottom:34px !important;}
  main > section[class*="py-"],
  main > section[class*="pt-"],
  main > section[class*="pb-"]{padding-top:32px !important;padding-bottom:32px !important;}
  /* Inner py-6/py-16 wrapper inside each section — respiro mais próximo do original */
  main > section > div[class*="py-6"][class*="sm:py-16"]{padding-top:16px !important;padding-bottom:16px !important;}
  /* keep images/media from spilling past the viewport edge */
  main > section img,main > section video{max-width:100% !important;height:auto;}
  /* Minera's 2-col sections stack on mobile with big mt-10/mt-16 (40-64px) margins
     between copy → image → feature list — tighten them so blocks sit closer */
  main > section [class*="mt-16"]{margin-top:20px !important;}
  main > section [class*="mt-10"]{margin-top:16px !important;}
  main > section [class*="mt-8"]{margin-top:14px !important;}
  /* Mineraroi-style ordering on mobile: image FIRST, then badge/title/copy below.
     The Minera image column has a recognizable min-h-[280px] (or similar) signature. */
  main > section [class*="min-h-["]:not(section){order:-1 !important;margin-top:0 !important;margin-bottom:16px !important;}
  /* Swipe section: imagem logo abaixo do título (badge → título → imagem → texto → lista → CTA) */
  section[data-ra-swipe="1"] [data-ra-swipe-col0]{display:contents !important;}
  section[data-ra-swipe="1"] [data-ra-swipe-wrap] > *,
  section[data-ra-swipe="1"] [data-ra-swipe-col0] > *{order:3 !important;}
  section[data-ra-swipe="1"] [data-ra-swipe-col0] > *:first-child{order:0 !important;}
  section[data-ra-swipe="1"] [data-ra-swipe-col0] > h1,
  section[data-ra-swipe="1"] [data-ra-swipe-col0] > h2,
  section[data-ra-swipe="1"] [data-ra-swipe-col0] > div:has(h1),
  section[data-ra-swipe="1"] [data-ra-swipe-col0] > div:has(h2){order:1 !important;}
  section[data-ra-swipe="1"] [data-ra-swipe-wrap] > div[class*="min-h-["]{order:2 !important;margin:14px auto !important;max-width:340px !important;width:100% !important;min-height:230px !important;height:230px !important;overflow:hidden !important;position:relative !important;background:#0d0d0d url('demo-minerador.png') center/cover no-repeat !important;border-radius:18px !important;box-shadow:0 12px 40px rgba(0,0,0,0.5) !important;border:1px solid rgba(255,140,0,0.15) !important;}
  /* Hide the broken React-rendered img (we use the bg image instead — no pen, no broken icon) */
  section[data-ra-swipe="1"] [data-ra-swipe-wrap] > div[class*="min-h-["] img{display:none !important;}
  /* Hide any ra-placeholder fallback box in the swipe section */
  section[data-ra-swipe="1"] .ra-placeholder{display:none !important;}

  /* === Análise section: ordem natural igual ao original (badge → título → copy → cards → imagem no fim) === */
  main > section[data-ra-analise="1"],
  section[data-ra-analise="1"]{padding-top:60px !important;}
  /* Análise: imagem logo abaixo do título (badge → título → imagem → texto → cards) */
  section[data-ra-analise="1"] [data-ra-analise-col0]{display:contents !important;}
  section[data-ra-analise="1"] [data-ra-analise-wrap] > *,
  section[data-ra-analise="1"] [data-ra-analise-col0] > *{order:3 !important;}
  section[data-ra-analise="1"] [data-ra-analise-col0] > *:first-child{order:0 !important;justify-self:center !important;align-self:center !important;}
  section[data-ra-analise="1"] [data-ra-analise-col0] > h1,
  section[data-ra-analise="1"] [data-ra-analise-col0] > h2,
  section[data-ra-analise="1"] [data-ra-analise-col0] > div:has(h1),
  section[data-ra-analise="1"] [data-ra-analise-col0] > div:has(h2){order:1 !important;}
  section[data-ra-analise="1"] [data-ra-analise-wrap] > div[class*="min-h-["]{order:2 !important;margin:14px auto !important;max-width:340px !important;width:100% !important;min-height:230px !important;height:230px !important;overflow:hidden !important;position:relative !important;background:#0d0d0d url('demo-analise-hero.png') center/cover no-repeat !important;border-radius:18px !important;box-shadow:0 12px 40px rgba(0,0,0,0.5) !important;border:1px solid rgba(255,140,0,0.15) !important;}
  section[data-ra-analise="1"] [data-ra-analise-wrap] > div[class*="min-h-["] img{display:none !important;}
  section[data-ra-analise="1"] .ra-placeholder{display:none !important;}
  /* Minerador section: hide the original Minera mockup (we inject our own bigger one after the title) */
  section:has([data-ra-minerador-img]) [class*="min-h-["]:not(section):not([data-ra-minerador-img]){display:none !important;}
  /* Make the injected minerador image break out of its parent's padding so it's bigger */
  [data-ra-minerador-img]{max-width:none !important;width:calc(100% + 40px) !important;margin:2px -20px 8px !important;}
  /* "FERRAMENTA EXCLUSIVA" copy was too tall on mobile (~8 lines) — shrink so it sits closer to the mockup */
  [data-ra-ferramenta-kicker] ~ p,
  [data-ra-ferramenta-kicker] + p{font-size:18px !important;line-height:1.4 !important;}
  [data-ra-ferramenta-kicker] ~ p *,
  [data-ra-ferramenta-kicker] + p *{font-size:inherit !important;line-height:inherit !important;}
  /* Minerador cards grid: 1 coluna no mobile (cards empilhados, um embaixo do outro) */
  div[class*="grid-cols-2"][class*="sm:grid-cols-3"]{grid-template-columns:1fr !important;gap:14px !important;}
  /* Altura compacta pros cards empilhados não ficarem gigantes */
  div[class*="grid-cols-2"][class*="sm:grid-cols-3"] > *{min-height:0 !important;}
  /* Bônus Exclusivos: center the Roteiros + Tutoriais cards on mobile */
  div[class*="grid-cols-1"][class*="lg:grid-cols-2"]{justify-items:center !important;justify-content:center !important;}
  div[class*="grid-cols-1"][class*="lg:grid-cols-2"] > *{max-width:340px !important;width:100% !important;}
  /* Padroniza tamanho dos títulos das 4 seções principais (Minerador / Swipe / Análise / Rastreamento)
     match com Minerador (20px / 32px). Swipe + Análise + Rastreamento estavam grandes demais. */
  section[data-ra-swipe="1"] h1,section[data-ra-swipe="1"] h2,
  section[data-ra-analise="1"] h1,section[data-ra-analise="1"] h2,
  section[data-ra-rast="1"] h1,section[data-ra-rast="1"] h2{
    font-size:20px !important;line-height:32px !important;font-weight:700 !important;letter-spacing:-0.005em !important;
  }
  /* Tighten Tailwind grid gaps inside content sections (gap-12=48px is excessive on mobile) */
  main > section [class*="gap-12"]{gap:20px !important;}
  main > section [class*="gap-16"]{gap:24px !important;}
  main > section [class*="gap-10"]{gap:18px !important;}
  /* Reduce excessive top/bottom padding on inner wrappers (Tailwind pt-8/pb-8 = 32px) */
  main > section > div [class*="pt-12"],main > section > div [class*="pt-8"]{padding-top:14px !important;}
  main > section > div [class*="pb-12"],main > section > div [class*="pb-8"]{padding-bottom:14px !important;}
  /* "Liberar Meu Acesso" CTA: estilo do QUERO MINERAR (solid orange + rounded-xl + max-width 280) */
  a[href="#planos"]{padding:14px 24px !important;font-size:13px !important;font-weight:700 !important;letter-spacing:0.02em !important;margin:0 auto !important;display:block !important;max-width:280px !important;width:100% !important;box-sizing:border-box !important;text-align:center !important;background:#FF8C00 !important;background-image:none !important;border-radius:14px !important;box-shadow:0 6px 24px rgba(255,140,0,0.25) !important;color:#0a0a0a !important;}
  /* Wrapper around the inline CTA — mais folga em cima (botão fica um pouco mais pra baixo) + respiro embaixo */
  main > section > div:has(> a[href="#planos"]){padding-top:36px !important;padding-bottom:40px !important;text-align:center !important;}
  /* Same treatment for the Minera-style CTA buttons (the bigger ones lower on the page) */
  button[class*="bg-minera-dark"][class*="rounded-xl"]{padding:10px 22px !important;font-size:12px !important;min-height:auto !important;max-width:280px !important;margin:24px auto 0 !important;display:block !important;}
  /* Mobile header (mineraroi pattern): full-width bar, logo + brand at left, hamburger at right */
  #ratoads-custom-nav{position:fixed !important;top:0 !important;left:0 !important;right:0 !important;transform:none !important;width:100% !important;max-width:none !important;border-radius:0 !important;border-left:none !important;border-right:none !important;border-top:none !important;padding:12px 18px !important;justify-content:space-between !important;gap:12px !important;background:rgba(10,10,10,0.92) !important;}
  #ratoads-custom-nav .rn-links,
  #ratoads-custom-nav .rn-cta{display:none !important;}
  #ratoads-custom-nav .rn-logo{display:flex !important;align-items:center !important;gap:10px !important;margin:0 !important;}
  #ratoads-custom-nav .rn-logo img{width:34px !important;height:34px !important;border-radius:8px !important;}
  #ratoads-custom-nav .rn-brand{display:inline !important;font-size:20px !important;font-weight:800 !important;color:#fff !important;letter-spacing:-.01em !important;}
  #ratoads-custom-nav .rn-burger{display:inline-flex !important;flex-direction:column !important;justify-content:center !important;align-items:center !important;gap:5px !important;width:36px !important;height:36px !important;background:transparent !important;border:none !important;cursor:pointer !important;padding:0 !important;}
  #ratoads-custom-nav .rn-burger span{display:block !important;width:22px !important;height:2px !important;background:#fff !important;border-radius:2px !important;}
  /* push hero down so it isn't covered by the fixed full-width header */
  #ratoads-real-hero{padding-top:96px !important;}
}

#ratoads-mobile-drawer{position:fixed;inset:0;z-index:999;pointer-events:none;visibility:hidden;font-family:'Sora',sans-serif;}
#ratoads-mobile-drawer.open{pointer-events:auto;visibility:visible;}
#ratoads-mobile-drawer .rmd-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);opacity:0;transition:opacity .25s ease;}
#ratoads-mobile-drawer.open .rmd-backdrop{opacity:1;}
#ratoads-mobile-drawer .rmd-panel{position:absolute;top:0;right:0;bottom:0;width:78%;max-width:340px;background:rgba(15,15,15,0.97);border-left:1px solid rgba(255,140,0,0.18);padding:18px 22px 24px;display:flex;flex-direction:column;gap:14px;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-10px 0 40px rgba(0,0,0,0.5);}
#ratoads-mobile-drawer.open .rmd-panel{transform:translateX(0);}
#ratoads-mobile-drawer .rmd-close{align-self:flex-end;width:42px;height:42px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#fff;font-size:24px;line-height:1;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
#ratoads-mobile-drawer .rmd-close:hover{background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.22);}
#ratoads-mobile-drawer .rmd-actions{display:flex;flex-direction:column;gap:14px;margin-top:6px;}
#ratoads-mobile-drawer .rmd-btn{display:flex;align-items:center;justify-content:center;padding:16px 22px;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none;transition:background .15s ease,transform .15s ease;}
#ratoads-mobile-drawer .rmd-btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.14);color:#fff;}
#ratoads-mobile-drawer .rmd-btn-ghost:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.26);}
#ratoads-mobile-drawer .rmd-btn-primary{background:#FF8C00;color:#000;font-weight:700;box-shadow:0 6px 20px rgba(255,140,0,0.3);}
#ratoads-mobile-drawer .rmd-btn-primary:hover{background:#FFA01F;transform:translateY(-1px);}

(function ratoadsAosObserver() {
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('[data-aos]').forEach(function(el){ el.classList.add('ra-aos-in'); });
    return;
  }
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var delay = entry.target.getAttribute('data-aos-delay') || 0;
        if (delay) {
          setTimeout(function(){ entry.target.classList.add('ra-aos-in'); }, parseInt(delay, 10));
        } else {
          entry.target.classList.add('ra-aos-in');
        }
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

  function observeAll() {
    var els = document.querySelectorAll('[data-aos]:not(.ra-aos-in)');
    els.forEach(function(el){ io.observe(el); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', observeAll);
  else observeAll();

  var aosObs = new MutationObserver(observeAll);
  aosObs.observe(document.documentElement, { childList: true, subtree: true });
  // Failsafe — after 8s, force-reveal anything still hidden so users don't see empty boxes
  setTimeout(function() {
    aosObs.disconnect();
    document.querySelectorAll('[data-aos]:not(.ra-aos-in)').forEach(function(el){ el.classList.add('ra-aos-in'); });
  }, 8000);
})();

(function fixBonusSectionOverlap() {
  function run() {
    var main = document.querySelector('main');
    if (!main) return;
    // Acha a section de bônus
    var bonusSec = null;
    var sections = main.querySelectorAll(':scope > section');
    for (var i = 0; i < sections.length; i++) {
      var t = sections[i].textContent || '';
      if (/Roteiros\s*\+\s*Transcrição/.test(t) && /Tutoriais/.test(t)) { bonusSec = sections[i]; break; }
    }
    if (!bonusSec) return;
    // Libera overflow em toda a cadeia de containers do bônus
    bonusSec.style.setProperty('overflow', 'visible', 'important');
    var c = bonusSec.firstElementChild;
    while (c) {
      c.style.setProperty('overflow', 'visible', 'important');
      c = c.firstElementChild;
    }
    // Mede a altura real do conteúdo e garante que a section cresce
    var innerH = bonusSec.scrollHeight;
    if (innerH > bonusSec.offsetHeight) {
      bonusSec.style.setProperty('min-height', innerH + 'px', 'important');
    }
    // Acha a próxima section (planos) e empurra pra baixo se necessário
    var nextSec = bonusSec.nextElementSibling;
    if (nextSec && nextSec.tagName === 'SECTION') {
      var gap = bonusSec.getBoundingClientRect().bottom - nextSec.getBoundingClientRect().top;
      if (gap > 0) {
        var cur = parseInt(nextSec.style.marginTop || '0') || 0;
        nextSec.style.setProperty('margin-top', (cur + gap + 40) + 'px', 'important');
      }
    }
  }
  function attempt() { run(); setTimeout(attempt, 600); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attempt);
  else attempt();

})();

  function findSec(predicate) {
    var main = document.querySelector('main');

  }

    var analise = findSec(function(s){ return /Análise Completa/.test(s.textContent || ''); });

    analise.dataset.raReordered = '1';
    return true;
  }
  function attempt(){ if (!tryMove()) setTimeout(attempt, 300); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attempt);
  else attempt();
  var obs = new MutationObserver(function(){ tryMove(); });
  obs.observe(document.documentElement, { childList: true, subtree: true });

    if (!isMobile()) return;

(function ratoadsScrollCtasToPlans() {
  // Faz qualquer CTA (menu "Começar" + botoes href="#planos") rolar suave ate a secao de planos.
  // NAO mexe nos botoes de compra dos planos (.rp-cta), nos chips do demo, nem no FAQ.
  function plansEl() { return document.getElementById('ratoads-custom-plans'); }
  function scrollToPlans() {
    var el = plansEl();
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // reajusta apos as animacoes (AOS) assentarem e mudarem alturas durante o scroll
    setTimeout(function(){ var e = plansEl(); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 750);
  }
  function isPlanPurchase(el) {
    return !!(el.closest && el.closest('#ratoads-custom-plans .rp-cta, a.rp-cta, .rp-cta'));
  }
  // textos dos CTAs principais (a maioria sao <button> do template, sem href)
  var CTA_RE = /(liberar meu acesso|quero minerar|quero ofertas|quero o acesso|garantir meu acesso|comecar agora mesmo|come[çc]ar agora)/i;
  function isCtaToPlans(el) {
    if (el.closest && el.closest('a[href="#planos"]')) return true;
    if (el.closest && el.closest('.rn-cta')) return true;
    var b = el.closest && el.closest('a, button, [role="button"]');
    if (b) {
      var t = (b.textContent || '').replace(/\s+/g, ' ').trim();
      if (CTA_RE.test(t)) return true;

  }, true);
})();

  function swapText(node) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      var changed = t;
      for (var i = 0; i < replacements.length; i++) {
        changed = changed.replace(replacements[i][0], replacements[i][1]);
      }
      if (changed !== t) node.nodeValue = changed;
    } else if (node.nodeType === 1 && node.childNodes && !/^(SCRIPT|STYLE)$/.test(node.tagName)) {
      for (var j = 0; j < node.childNodes.length; j++) swapText(node.childNodes[j]);
    }
  }

  function run() { swapText(document.body); document.title = 'RatoAds'; }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }

  var observer = new MutationObserver(function(mutations) {
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      for (var k = 0; k < m.addedNodes.length; k++) swapText(m.addedNodes[k]);
      if (m.type === 'characterData') swapText(m.target);
    }
  });
  observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
})();

(function rewriteFaqAnswers() {
  var done = { metrics: false, vslAccess: false, extRemoved: false };

  function run() {
    var all = document.querySelectorAll('p, span, div, li');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.children.length > 0) continue;
      var t = (el.textContent || '').trim();

      /* Troca resposta: acesso ao Swipe */
      if (!done.vslAccess && /Sim\.\s*Al[eé]m da se[çc][aã]o\s*["""]?Rato Minera["""]?\s*onde voc[eê] ter[aá] acesso a milh/i.test(t)) {
        el.textContent = 'Sim. Além da seção "minerador automático" onde voce minera ofertas do nicho de sua preferencia, você terá acesso ao Swipe com centenas de ofertas e funis prontos para escalados.';
        done.vslAccess = true;
      }

      /* Troca resposta: quando as métricas atualizam */
      if (!done.metrics && /Todos os dias [aà]s 0?8[h:]?0?0/i.test(t)) {
        el.textContent = 'As métricas atualizam a todo segundo, apenas o rastreamento de ofertas que atualiza todo dia às 7 da manhã.';
        done.metrics = true;
      }
    }

    /* Remove todos os FAQs que mencionam "extensão" no texto da pergunta */
    var faqCandidates = document.querySelectorAll('p, span, div, summary, button, h3, h4, a');
    var removed = 0;
    for (var j = 0; j < faqCandidates.length; j++) {
      var el2 = faqCandidates[j];
      if (el2.getAttribute('data-ra-ext-hidden')) continue;
      /* Skip if inside Rastreamento section — "Extensão RatoAds" caption legitimamente aparece lá */
      var skipSec = el2.closest('section');
      if (skipSec && /Rastreamento de Ofertas/.test(skipSec.textContent || '')) continue;
      var txt = (el2.textContent || '').trim();
      if (/extens[aã]o/i.test(txt) && txt.length < 120) {
        var box = el2;
        for (var k = 0; k < 10; k++) {
          if (!box.parentElement) break;
          var par = box.parentElement;
          if (par.tagName === 'SECTION' || par.tagName === 'MAIN') break;
          var cs = window.getComputedStyle(box);
          if (cs.borderRadius && parseFloat(cs.borderRadius) > 0) break;
          box = par;
        }
        box.style.setProperty('display', 'none', 'important');
        box.setAttribute('data-ra-ext-hidden', '1');
        removed++;
      }
    }
    if (removed > 0) done.extRemoved = true;

    return done.metrics && done.vslAccess && done.extRemoved;
  }

  function attempt() { if (!run()) setTimeout(attempt, 400); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attempt);
  else attempt();
})();

// ── ManyChat attribution: bulletproof tracking ──
(function mcAttribution() {
  function getCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  // 1. Resolve slug from cookie, URL params, or localStorage
  var slug = getCookie('mc_slug');
  if (!slug) {
    var sp = new URLSearchParams(window.location.search);
    slug = sp.get('utm_term') || sp.get('mc_slug') || null;
  }
  if (!slug) {
    try { slug = localStorage.getItem('mc_slug'); } catch(e) {}
  }
  if (!slug) return;

  // 2. Persist in localStorage (survives cookie clearing, lasts forever)
  try { localStorage.setItem('mc_slug', slug); } catch(e) {}

  // 3. Append UTMs + src to all Kirvano checkout links (Utmify needs UTMs on checkout URL)
  var utmParams = '';
  (function() {
    var sp = new URLSearchParams(window.location.search);
    var params = [];
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function(k) {
      var v = sp.get(k);
      if (v) params.push(k + '=' + encodeURIComponent(v));
    });
    params.push('src=' + encodeURIComponent(slug));
    utmParams = params.join('&');
  })();

  function tagLinks() {
    document.querySelectorAll('a[href*="pay.kirvano.com"]').forEach(function(a) {
      var href = a.getAttribute('href');
      if (href.indexOf('utm_source=') === -1 && href.indexOf('src=') === -1) {
        a.setAttribute('href', href + (href.indexOf('?') === -1 ? '?' : '&') + utmParams);
      }
    });
  }
  tagLinks();
  var obs = new MutationObserver(tagLinks);
  obs.observe(document.documentElement, { childList: true, subtree: true });
  setTimeout(function() { obs.disconnect(); }, 20000);

  // 4. Save pending attribution to server (IP + slug)
  fetch('/api/mc/attribute', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mc_slug: slug }),
  }).catch(function() {});

  // 5. Watch email inputs — save attribution with email as soon as they type it
  var lastSavedEmail = '';
  function trySaveEmail() {
    var inputs = document.querySelectorAll('input[type="email"], input[name="email"]');
    inputs.forEach(function(inp) {
      var val = inp.value.trim().toLowerCase();
      if (val && val.indexOf('@') > 0 && val !== lastSavedEmail) {
        lastSavedEmail = val;
        fetch('/api/mc/attribute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mc_slug: slug, email: val }),
        }).catch(function() {});
      }
    });
  }
  document.addEventListener('change', function(e) {
    if (e.target && (e.target.type === 'email' || e.target.name === 'email')) trySaveEmail();
  });
  // Also save on checkout click
  document.addEventListener('click', function(e) {
    var a = e.target.closest && e.target.closest('a[href*="pay.kirvano.com"]');
    if (a) trySaveEmail();
  });
})();
