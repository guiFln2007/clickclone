name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Enviar arquivos para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 45.152.46.153
          port: 65002
          username: u851649647
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".next,public,package.json,package-lock.json,ecosystem.config.js"
          target: /home/u851649647/domains/ratoads.com.br/nodejs

      - name: Reiniciar aplicação no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.152.46.153
          port: 65002
          username: u851649647
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH
            cd /home/u851649647/domains/ratoads.com.br/nodejs
            npm ci --production
            pm2 restart ratoads || pm2 start ecosystem.config.js --update-env
            pm2 save
            echo "✅ Deploy concluído!"
